name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  inline-script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and check the inline script
        run: |
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf-8').read()
          m = re.search(r'<script>([\s\S]*?)</script>', s)
          assert m, 'inline script not found'
          open('/tmp/app.js', 'w', encoding='utf-8').write(m.group(1))
          PY
          node --check /tmp/app.js
      - name: No remote assets
        run: |
          python3 - <<'PY'
          import re
          s = open('index.html', encoding='utf-8').read()
          assert not re.search(r'<script[^>]+src=|<link[^>]+rel=["\']stylesheet', s), 'remote assets found'
          PY
